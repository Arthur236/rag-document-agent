[project]
name = "rag-document-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arthur", email = "" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "dotenv>=0.9.9",
    "huggingface-hub>=1.27.0",
    "langchain>=1.3.15",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.15.0",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.0",
]

[project.scripts]
rag-document-agent = "rag_document_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
