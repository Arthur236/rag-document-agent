[project]
name = "rag-document-agent"
version = "0.1.0"
description = "Streamlit app for asking questions about PDF, Word, PowerPoint, and text documents using a fully local RAG pipeline"
readme = "README.md"
keywords = ["rag", "llm", "streamlit", "langchain", "embeddings", "document-qa"]
authors = [
    { name = "Arthur236" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "huggingface-hub>=1.27.0",
    "langchain-core>=1.5.4",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
    "torch>=2.13.0",
    "transformers>=5.15.0",
]

[project.scripts]
rag-document-agent = "rag_document_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"
